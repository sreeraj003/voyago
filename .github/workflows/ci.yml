name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: voyago
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: voyago
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voyago -d voyago"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://voyago:ci-only-password@localhost:5432/voyago?schema=public
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed development data (twice, to prove it is idempotent)
        run: pnpm db:seed && pnpm db:seed

      - name: API smoke and database constraint tests (real Postgres/PostGIS + Redis)
        run: pnpm --filter @voyago/api test:e2e
